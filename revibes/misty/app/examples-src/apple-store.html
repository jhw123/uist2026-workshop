<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body { background:#f5f5f7; color:#1d1d1f; height: 720px; position: relative; }
.bar { text-align:center; font-weight: 600; font-size: 17px; padding: 14px 0 12px; background:#fff; border-bottom: 1px solid #e5e5ea; }
h2 { font-size: 24px; font-weight: 700; margin: 18px 16px 10px; letter-spacing:-0.3px; }
.card { margin: 0 16px; background:#dfe3f7; border-radius: 18px; overflow:hidden; }
.card img { width: 100%; height: 190px; object-fit: cover; display:block; }
.card .body { padding: 14px 16px 18px; }
.kicker { font-size: 12px; font-weight: 600; color:#3b3b58; }
.title { font-size: 20px; font-weight: 700; margin-top: 2px; line-height: 1.2; }
.desc { font-size: 13px; color:#4a4a62; margin-top: 8px; line-height: 1.4; }
.ways { margin: 0 16px; background:#fff; border-radius: 18px; height: 90px; overflow:hidden; display:flex; align-items:flex-end; }
.ways img { width: 100%; height: 70px; object-fit: cover; opacity:.9; }
.tabs { position:absolute; left:0; right:0; bottom:0; height: 76px; background:#fff; border-top: 1px solid #e5e5ea; display:flex; justify-content:space-around; align-items:flex-start; padding-top: 10px; }
.tab { display:flex; flex-direction:column; align-items:center; gap:4px; font-size: 10px; color:#8e8e93; width: 64px; }
.tab.on { color:#1d1d1f; font-weight: 600; }
.home { position:absolute; left:50%; bottom:8px; width: 130px; height: 5px; border-radius: 3px; background:#1d1d1f; transform: translateX(-50%); }
</style></head><body>
<div class="bar">Products</div>
<h2>Featured</h2>
<div class="card"><img src="../public/stock/landscape2.jpg"><div class="body"><div class="kicker">Limited Time</div><div class="title">Save on laptops and tablets for university.</div><div class="desc">Plus get headphones with a laptop, a stylus with a tablet, 20% off extended care, and more.</div></div></div>
<h2>Ways to save</h2>
<div class="ways"><img src="../public/stock/landscape3.jpg"></div>
<div class="tabs">
  <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>For You</div>
  <div class="tab on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="10" rx="1.5"/><path d="M5 19h8"/><rect x="17" y="8" width="5" height="11" rx="1.2"/></svg>Products</div>
  <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 6-4 2 2-6z"/></svg>Go Further</div>
  <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</div>
  <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 13H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Bag</div>
</div>
<div class="home"></div>
</body></html>
