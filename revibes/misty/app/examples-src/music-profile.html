<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body { background:#fff; color:#111; padding: 16px 0 14px; height: 600px; position: relative; }
.top { display:flex; justify-content:space-between; align-items:center; padding: 0 16px; }
.back { color:#e5243b; font-size: 17px; display:flex; align-items:center; gap:4px; }
.more { width: 30px; height: 30px; border-radius: 50%; background:#f2f2f7; display:flex; align-items:center; justify-content:center; gap:3px; }
.more i { width:4px; height:4px; border-radius:50%; background:#e5243b; display:block; }
.avatar { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin: 6px auto 0; display:block; }
.avatar-wrap { position: relative; width:150px; margin: 0 auto; }
.lock { position:absolute; right: 4px; bottom: 4px; width: 32px; height: 32px; border-radius: 50%; background:#fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center; }
.name { text-align:center; font-size: 34px; font-weight: 800; letter-spacing:-0.5px; margin-top: 10px; }
.handle { text-align:center; font-size: 20px; color:#8e8e93; margin-top: 2px; }
.edit { display:block; margin: 12px auto 0; background:#e5243b; color:#fff; border:0; border-radius: 999px; padding: 8px 26px; font-size: 17px; font-weight: 600; }
h2 { font-size: 22px; font-weight: 700; margin: 26px 16px 10px; }
.row { display:flex; gap: 12px; padding: 0 16px; overflow: hidden; }
.card { flex: 0 0 150px; }
.art { width: 150px; height: 150px; border-radius: 8px; border: 1px solid #e5e5ea; overflow:hidden; background:#fff; }
.art .hdr { display:flex; justify-content:space-between; align-items:baseline; padding: 8px 10px 0; font-weight: 700; font-size: 15px; }
.art .hdr small { font-size: 9px; font-weight: 600; color:#444; }
.art .sub { padding: 0 10px; font-weight: 700; font-size: 13px; margin-top: -2px; }
.art .grid { margin: 6px 10px 0; height: 96px; display:grid; grid-template-columns: repeat(6,1fr); grid-template-rows: repeat(5,1fr); gap: 1px; }
.cap { margin-top: 8px; font-size: 14px; }
.cap small { display:block; color:#8e8e93; font-size: 13px; }
</style></head><body>
<div class="top"><div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Library</div><div class="more"><i></i><i></i><i></i></div></div>
<div class="avatar-wrap"><img class="avatar" src="../public/stock/landscape0.jpg"><div class="lock"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div></div>
<div class="name">Fuji</div>
<div class="handle">@fujimisty</div>
<button class="edit">Edit</button>
<h2>Listening To</h2>
<div class="row">
  <div class="card"><div class="art"><div class="hdr"><span>Top 100</span><small>Music</small></div><div class="sub">Global</div><div class="grid" id="g1"></div></div><div class="cap">Top 100: Global<small>Music</small></div></div>
  <div class="card"><div class="art"><div class="hdr"><span>Top 100</span><small>Music</small></div><div class="sub">United States</div><div class="grid" id="g2"></div></div><div class="cap">Top 100: USA<small>Music</small></div></div>
  <div class="card"><div class="art"><div class="hdr"><span>Top 100</span><small>Music</small></div><div class="sub">United Kingdom</div><div class="grid" id="g3"></div></div><div class="cap">Top 100: UK<small>Music</small></div></div>
</div>
<script>
function fill(id, from, to){const g=document.getElementById(id);for(let r=0;r<5;r++)for(let c=0;c<6;c++){const d=document.createElement('div');const t=Math.min(1,(c/5)*0.75+(r/4)*0.35);const mix=(a,b)=>Math.round(a+(b-a)*t);d.style.background=`rgb(${mix(from[0],to[0])},${mix(from[1],to[1])},${mix(from[2],to[2])})`;g.appendChild(d);}}
fill('g1',[228,30,55],[255,235,238]); fill('g2',[30,30,200],[255,120,120]); fill('g3',[20,20,120],[230,60,90]);
</script>
</body></html>
